media:
  input: src/assets
  output: /src/assets

content:
  - name: posts
    label: Posts (Bài viết Knowledge)
    type: collection
    path: src/content/posts
    filename: "{slug}.mdx"
    view:
      fields: [title, published, author]
    fields:
      - name: title
        label: Tiêu đề bài viết
        type: string
        required: true
        description: "Tiêu đề chính của bài viết"
      - name: published
        label: Ngày xuất bản
        type: date
        required: true
        description: "Chọn ngày đăng bài"
      - name: updated
        label: Ngày cập nhật
        type: date
        description: "Ngày cập nhật gần nhất (không bắt buộc)"
      - name: readTime
        label: Thời gian đọc
        type: string
        required: true
        default: "5 min read"
        description: "Định dạng ví dụ: 5 min read"
      - name: author
        label: Tác giả
        type: select
        options:
          - aditi-patel
          - neil-stone
        default: aditi-patel
        required: true
        description: "Chọn tác giả từ danh sách"
      - name: excerpt
        label: Mô tả ngắn (Excerpt)
        type: string
        required: true
        description: "Tóm tắt ngắn bài viết hiển thị ở danh sách"
      - name: images
        label: Ảnh bài viết
        type: object
        required: true
        fields:
          - name: card
            label: Ảnh thẻ (Card Image)
            type: image
            required: true
            description: "Chọn ảnh đại diện cho bài viết"
      - name: body
        label: Nội dung bài viết
        type: rich-text

  - name: reviews
    label: Reviews (Bài đánh giá Brand)
    type: collection
    path: src/content/reviews
    filename: "{slug}.mdx"
    view:
      fields: [title, heroTitle, brand]
    fields:
      - name: title
        label: Tiêu đề trang
        type: string
        required: true
        description: "Tiêu đề chuẩn SEO của bài review"
      - name: heroTitle
        label: Tiêu đề Banner Hero
        type: string
        required: true
        description: "Tiêu đề lớn hiển thị ở đầu bài review"
      - name: description
        label: Mô tả Meta Description
        type: string
        required: true
        description: "Mô tả SEO xuất hiện trên Google"
      - name: promo
        label: Dòng Khuyến mãi (Promo Text)
        type: string
        description: "Ví dụ: Get 10% Off"
      - name: brand
        label: Brand liên kết
        type: select
        options:
          - wix
          - hostinger
          - shopify
          - squarespace
          - webador
          - square-online
          - ionos
          - hubspot
          - clickup
          - bubble
          - base44
          - lovable
          - monday
          - tide
        default: wix
        required: true
        description: "Chọn thương hiệu cần đánh giá"
      - name: author
        label: Tác giả bài review
        type: select
        options:
          - aditi-patel
          - neil-stone
        default: aditi-patel
        required: true
        description: "Chọn tác giả thực hiện review"
      - name: pros
        label: Ưu điểm (Pros)
        type: list
        description: "Thêm từng ưu điểm của sản phẩm"
      - name: cons
        label: Nhược điểm (Cons)
        type: list
        description: "Thêm từng nhược điểm của sản phẩm"
      - name: summary
        label: Tóm tắt bài review
        type: string
        description: "Nội dung tóm tắt cho màn hình nhỏ"
      - name: body
        label: Nội dung bài review
        type: rich-text

  - name: brands
    label: Brands (Danh tính đối tác)
    type: collection
    path: src/content/brands
    filename: "{slug}.yaml"
    view:
      fields: [name, affiliateUrl]
    fields:
      - name: name
        label: Tên thương hiệu
        type: string
        required: true
      - name: logo
        label: Logo
        type: image
        required: true
      - name: logoAlt
        label: Logo Alt Text
        type: string
        required: true
      - name: affiliateUrl
        label: Link Affiliate
        type: string
        required: true

  - name: authors
    label: Authors (Tác giả)
    type: collection
    path: src/content/authors
    filename: "{slug}.yaml"
    view:
      fields: [name, role]
    fields:
      - name: name
        label: Tên tác giả
        type: string
        required: true
      - name: role
        label: Vai trò
        type: string
        required: true
      - name: avatar
        label: Ảnh đại diện
        type: image
