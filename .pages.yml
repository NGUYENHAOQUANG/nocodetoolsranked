media:
  input: src/assets
  output: /src/assets

content:
  - name: posts
    label: Posts (Bài viết Knowledge)
    type: collection
    path: src/content/posts
    filename: "{slug}.mdx"
    view:
      fields: [title, published, author]
    fields:
      - name: title
        label: Tiêu đề bài viết
        type: string
        required: true
      - name: published
        label: Ngày xuất bản
        type: date
        required: true
      - name: updated
        label: Ngày cập nhật
        type: date
      - name: readTime
        label: Thời gian đọc (vd: 7 min read)
        type: string
        required: true
      - name: author
        label: Tác giả
        type: reference
        collection: authors
        required: true
      - name: excerpt
        label: Mô tả ngắn
        type: string
        required: true
      - name: images
        label: Hình ảnh bài viết
        type: object
        required: true
        fields:
          - name: card
            label: Ảnh thẻ bài viết (Card Image)
            type: image
            required: true
      - name: body
        label: Nội dung bài viết
        type: rich-text

  - name: reviews
    label: Reviews (Bài đánh giá Brand)
    type: collection
    path: src/content/reviews
    filename: "{slug}.mdx"
    view:
      fields: [title, heroTitle, brand]
    fields:
      - name: title
        label: Tiêu đề trang
        type: string
        required: true
      - name: heroTitle
        label: Tiêu đề Banner Hero
        type: string
        required: true
      - name: description
        label: Mô tả Meta Description
        type: string
        required: true
      - name: promo
        label: Dòng Khuyến mãi (Promo Text)
        type: string
      - name: brand
        label: Brand liên kết
        type: reference
        collection: brands
        required: true
      - name: author
        label: Tác giả bài review
        type: reference
        collection: authors
        required: true
      - name: pros
        label: Ưu điểm (Pros)
        type: list
      - name: cons
        label: Nhược điểm (Cons)
        type: list
      - name: summary
        label: Tóm tắt bài review
        type: string
      - name: body
        label: Nội dung bài review
        type: rich-text

  - name: brands
    label: Brands (Danh tính đối tác)
    type: collection
    path: src/content/brands
    filename: "{slug}.yaml"
    view:
      fields: [name, affiliateUrl]
    fields:
      - name: name
        label: Tên thương hiệu
        type: string
        required: true
      - name: logo
        label: Logo
        type: image
        required: true
      - name: logoAlt
        label: Logo Alt Text
        type: string
        required: true
      - name: affiliateUrl
        label: Link Affiliate
        type: string
        required: true

  - name: authors
    label: Authors (Tác giả)
    type: collection
    path: src/content/authors
    filename: "{slug}.yaml"
    view:
      fields: [name, role]
    fields:
      - name: name
        label: Tên tác giả
        type: string
        required: true
      - name: role
        label: Vai trò
        type: string
        required: true
      - name: avatar
        label: Ảnh đại diện
        type: image
        required: true
