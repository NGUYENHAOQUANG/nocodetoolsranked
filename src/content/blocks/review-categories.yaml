# Bon hang muc cham diem cua khoi "Review Highlights" duoi bang xep hang.
#
# TOAN SITE, khong doi theo trang: ban goc de chung trong goi ngon ngu chu khong
# trong du lieu tung trang. Vi vay component tu `getEntry` thay vi nhan qua props
# - dung phep thu trong CLAUDE.md ("nhan khong doi o dau ca -> tu lay").
#
# THU TU LA HOP DONG: moi bai review khai dung 4 phan tu `categories` theo DUNG
