brand: "the-pets-table"
categories:
  - title: "Food Types"
    icon: "../../assets/icons/food-types.svg"
    score: 10
    description: "Offers fresh, air-dried, and freeze-dried meals for different needs. Recipes use real meat, simple vegetables, and clean ingredients. Options fit puppies, adults, and dogs with sensitive stomachs."
  - title: "Quality"
    icon: "../../assets/icons/quality.svg"
    score: 10
    description: "Meals created with high-quality proteins and balanced nutrients. No fillers, artificial flavors, or cheap ingredients used. Foods prepared under strict safety standards for consistent quality."
  - title: "Plans"
    icon: "../../assets/icons/plans.svg"
    score: 9
    description: "Plans tailored to your dog’s age, weight, and activity level. Subscriptions stay flexible with easy adjustments anytime. Supports mixed feeding for owners wanting varied meal styles."
  - title: "Value"
    icon: "../../assets/icons/value.svg"
    score: 10
    description: "Strong value considering the high-quality ingredients used. Pricing stays fair compared to other premium dog food brands. Clear billing with no hidden charges or surprise add-ons."
pros:
  - "High-quality ingredients"
  - "Multiple meal styles"
  - "No fillers or artificial additives"
  - "Flexible subscription plans"
cons:
  - "Costs more than basic kibble"
