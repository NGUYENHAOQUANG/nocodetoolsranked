# Bang xep hang TRANG CHU - 8 brand, doc thang tu DOM da render cua trang mau.
#
# VI SAO 8 CHU KHONG PHAI 10: CMS ben do khai 10 doi tac, nhung hai brand (Tide va
# IONOS) bi LOC di truoc khi render - moi dong doi tac co dieu kien hien theo mui gio
# va vung. Site tinh khong co tang loc do, nen o day chi liet ke dung nhung gi nguoi
# doc that su nhin thay. Hai brand kia van con trong content/brands/ va van co trang
# review; IONOS van nam trong danh sach /reviews/ va menu header.
#
# `rating` di theo VI TRI chu khong theo brand: bo diem 9.8 / 9.7 / 8.5 / 8.2 / 7.9 /
# 7.6 / 7.5 / 7.3 gan lien voi hang 1..8. Doi thu tu thi doi ca diem, dung keo diem
# di theo brand.
#
# `bullets` la dung nhung gach dau dong HIEN THI, khong phai tat ca gach dau dong brand
# do co: CMS ben kia khai du 5 dong roi cat bot bang `desktopDetailsLimit`. O day noi
# dung chinh la thu duoc hien, nen cat san - khong can them mot truong gioi han.
